production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  perfectbook_sync_catalog:
    class: PerfectBook::SyncCatalogJob
    schedule: every 15 minutes
  perfectbook_sync_contacts:
    class: PerfectBook::SyncContactsJob
    schedule: every 15 minutes
  perfectbook_sync_bookings:
    class: PerfectBook::SyncBookingsJob
    schedule: every 15 minutes
  tasks_generate_automatic:
    class: Tasks::GenerateAutomaticJob
    schedule: every day at 6am
  today_digest:
    class: TodayDigestJob
    schedule: every day at 7am
  mail_sync:
    class: Mail::SyncJob
    schedule: every 5 minutes
  document_holdings_purge:
    class: DocumentHoldingsPurgeJob
    schedule: every hour
  pipeline_digest:
    class: PipelineDigestJob
    schedule: every monday at 7am
  lead_notifications:
    command: "LeadNotification.enqueue_pending"
    schedule: every minute
  ad_conversions_export:
    class: AdConversions::ExportJob
    schedule: every day at 2:40am America/Los_Angeles
  ai_prune_calls:
    class: Ai::PruneCallsJob
    schedule: every day at 3am
